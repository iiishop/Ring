name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: |
          pip install --upgrade pip
          pip install pyinstaller pyside6 pynput pygetwindow

      - name: Build Windows executable
        run: pyinstaller --noconfirm --clean Ring.spec

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ring-exe
          path: dist/Ring.exe

      - name: Build installer
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          choco install nsis --no-progress
          $version = "${{ github.ref_name }}" -replace '^v', ''
          & "C:\Program Files (x86)\NSIS\makensis.exe" "/DVERSION=$version" installer\Ring.nsi

      - name: Build portable zip
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          Compress-Archive -Path dist\Ring.exe -DestinationPath "Ring-portable-v$version.zip"

      - name: Generate changelog
        if: github.ref_type == 'tag'
        id: changelog
        shell: pwsh
        run: |
          $lastTag = git describe --tags --abbrev=0 2>$null
          if ($lastTag) {
            $log = git log "$lastTag..HEAD" --oneline --no-merges
          } else {
            $log = git log --oneline --no-merges
          }
          $body = "## What's Changed`n`n$log"
          Set-Content -Path changelog.md -Value $body
          "path=changelog.md" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Ring ${{ github.ref_name }}
          body_path: ${{ steps.changelog.outputs.path }}
          files: |
            dist/Ring.exe
            Ring-*.exe
            Ring-portable-*.zip
